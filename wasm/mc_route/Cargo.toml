[package]
name = "mc_route"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"] # rlib so `cargo test` can run the native parity test

[dependencies]
wasm-bindgen = "0.2"
rustc-hash = "2"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
debug = ["console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
